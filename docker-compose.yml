services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codespace_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codespace_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
